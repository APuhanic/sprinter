<!doctype html>
<html lang="%paramLang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#a84c28" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<!-- Consent Mode v2 — default to denied until the visitor opts in via the
		     ConsentBanner; restore granted for returning visitors who accepted.
		     Runs before GTM so GA4 / Ads tags start in the correct consent state. -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('consent', 'default', {
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				analytics_storage: 'denied',
				functionality_storage: 'granted',
				security_storage: 'granted',
				wait_for_update: 500
			});
			try {
				if (localStorage.getItem('sprinter-consent') === 'granted') {
					gtag('consent', 'update', {
						ad_storage: 'granted',
						ad_user_data: 'granted',
						ad_personalization: 'granted',
						analytics_storage: 'granted'
					});
				}
			} catch (e) {}
		</script>
		<!-- Google Tag Manager (container GTM-W3FW6X9G fires GA4 + Meta Pixel).
		     Gated on hostname so dev + Vercel previews don't pollute analytics. -->
		<script>
			(function (w, d, s, l, i) {
				if (!/^(www\.)?sprinter\.hr$/.test(w.location.hostname)) return;
				w[l] = w[l] || [];
				w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
				var f = d.getElementsByTagName(s)[0],
					j = d.createElement(s),
					dl = l !== 'dataLayer' ? '&l=' + l : '';
				j.async = true;
				j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
				f.parentNode.insertBefore(j, f);
			})(window, document, 'script', 'dataLayer', 'GTM-W3FW6X9G');
		</script>
		<!-- End Google Tag Manager -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Google Tag Manager (noscript) — only fires on production host -->
		<noscript
			><iframe
				src="https://www.googletagmanager.com/ns.html?id=GTM-W3FW6X9G"
				height="0"
				width="0"
				style="display:none;visibility:hidden"
				title="Google Tag Manager"
			></iframe></noscript>
		<!-- End Google Tag Manager (noscript) -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
